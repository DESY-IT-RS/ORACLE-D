name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
    ruff-check:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"
            cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff
        run: |
          # linting check
          ruff check .
          # formatting check
          ruff format --check .
